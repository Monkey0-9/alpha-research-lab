[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .venv,
    __pycache__,
    .git,
    node_modules,
    build,
    dist

[tool:pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . backend
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:anyio.*
